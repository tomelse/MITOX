    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "palettable>=3.3.3",
    "patato>=0.7.0",
    "scikit-learn>=1.9.1",
